{% extends 'gestion/base_gestion.html' %}

{% comment %} Esta plantilla se usa para crear y modificar todos los modelos {% endcomment %}

{% block panel %}
  <h2>{{ titulo }}</h2>
  <div class="tarjeta formulario">
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit" class="btn btn-verde">Guardar</button>
      <a class="btn btn-secondary" href="{% url volver %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
