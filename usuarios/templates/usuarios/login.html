{% extends 'base.html' %}

{% block contenido %}
  <div style="max-width: 500px;">
    <h2>Iniciar sesión</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-verde w-100">Entrar</button>
    </form>
    <p class="mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
  </div>
{% endblock %}
