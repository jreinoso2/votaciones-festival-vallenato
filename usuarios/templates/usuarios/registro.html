{% extends 'base.html' %}

{% block contenido %}
  <div style="max-width: 500px;">
    <h2>Registro</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-verde w-100">Registrarme</button>
    </form>
    <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
  </div>
{% endblock %}
